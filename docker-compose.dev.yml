version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: kitchen-box-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - kitchen_box_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  kitchen_box_pgdata:
